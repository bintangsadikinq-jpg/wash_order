<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0284c7">
    <title>Login Staf - Wash Order</title>
    <style>
        :root { --primary: #0ea5e9; --dark: #0284c7; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
            background: linear-gradient(135deg, #075985 0%, #0284c7 45%, #38bdf8 100%); }
        .card { width: 100%; max-width: 400px; background: #fff; border-radius: 24px; padding: 32px 28px; box-shadow: 0 24px 60px rgba(2, 6, 23, .3); }
        .brand { text-align: center; margin-bottom: 6px; }
        .brand .logo { font-size: 48px; line-height: 1; }
        .brand h1 { margin: 6px 0 2px; font-size: 26px; }
        .brand h1 b { color: var(--primary); }
        .brand p { margin: 0; color: var(--muted); font-size: 14px; }
        label { display: block; font-weight: 600; font-size: 14px; margin: 18px 0 6px; }
        input { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid var(--line); border-radius: 12px; background: #f8fafc; outline: none; font-family: inherit; }
        input:focus { border-color: var(--primary); background: #fff; }
        .pass { position: relative; }
        .pass input { padding-right: 52px; }
        .pass button { position: absolute; right: 6px; top: 6px; width: 42px; height: 42px; border: 0; background: none; font-size: 18px; cursor: pointer; }
        .err { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: #fef2f2; color: #b91c1c; font-size: 14px; }
        .btn { width: 100%; margin-top: 22px; padding: 15px; border: 0; border-radius: 14px; background: var(--primary); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .btn:hover { background: var(--dark); }
        .btn[disabled] { opacity: .65; }
        .hint { text-align: center; margin: 18px 0 0; font-size: 13px; color: var(--muted); }
        .hint a { color: var(--dark); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <div class="logo">🫧</div>
            <h1>Wash<b>Order</b></h1>
            <p>Login Staf &mdash; admin &amp; washer</p>
        </div>
        <form id="form">
            <label for="username">Username</label>
            <input id="username" type="text" autocapitalize="none" autocomplete="username" required autofocus placeholder="Username">
            <label for="password">Password</label>
            <div class="pass">
                <input id="password" type="password" autocomplete="current-password" required placeholder="Password">
                <button type="button" id="toggle" aria-label="Tampilkan password">👁</button>
            </div>
            <div class="err" id="err"></div>
            <button class="btn" id="btn" type="submit">Masuk</button>
        </form>
        <p class="hint">Mau memesan cucian? <a href="/user/">Pesan tanpa login &rarr;</a></p>
    </main>

<script>
(function () {
    var $ = function (id) { return document.getElementById(id); };
    var KEYS = { admin: 'wo_admin_token', washer: 'wo_washer_token' };
    var HOME = { admin: '/admin/dashboard.html', washer: '/washer/' };

    function go(role) { location.replace(HOME[role]); }

    // sudah login? langsung arahkan ke panelnya
    ['admin', 'washer'].forEach(function (role) {
        var t; try { t = localStorage.getItem(KEYS[role]); } catch (e) {}
        if (!t) return;
        fetch('/api/auth/' + role + '/me', { headers: { Authorization: 'Bearer ' + t } }).then(function (r) { if (r.ok) go(role); });
    });

    $('toggle').onclick = function () { var p = $('password'); p.type = p.type === 'password' ? 'text' : 'password'; };

    $('form').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = $('btn'), err = $('err');
        err.style.display = 'none'; btn.disabled = true; btn.textContent = 'Memeriksa...';
        fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: $('username').value, password: $('password').value }) })
            .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Login gagal'); return j; }); })
            .then(function (j) {
                try { localStorage.setItem(KEYS[j.role], j.token); } catch (x) {}
                go(j.role);
            })
            .catch(function (ex) { err.textContent = ex.message; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Masuk'; });
    });
})();
</script>
</body>
</html>
