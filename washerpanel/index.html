<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0ea5e9">
    <title>Washer - Wash Order</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- APP -->
<div id="app-view" class="hidden">
    <header class="topbar">
        <div>
            <small>Halo,</small>
            <strong id="who">-</strong>
        </div>
        <button id="logout" class="btn-ghost">Keluar</button>
    </header>

    <main>
        <div class="stats">
            <div class="stat"><b id="st-active">0</b><span>Tugas aktif</span></div>
            <div class="stat"><b id="st-today">0</b><span>Selesai hari ini</span></div>
            <div class="stat"><b id="st-total">0</b><span>Total selesai</span></div>
        </div>

        <nav class="tabs">
            <button class="tab active" data-tab="active">Tugas Saya</button>
            <button class="tab" data-tab="done">Riwayat</button>
        </nav>

        <div id="list"></div>
    </main>

    <div id="refresh-note" class="refresh-note">Diperbarui otomatis</div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
