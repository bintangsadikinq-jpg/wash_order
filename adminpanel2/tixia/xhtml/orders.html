<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wash Order | Pesanan</title>
<link rel="icon" type="image/png" sizes="16x16" href="./images/favicon.png">
<link href="./css/style.css" rel="stylesheet">
<link href="./css/wo.css" rel="stylesheet">
</head>
<body>
<script src="./js/wo-admin.js"></script>
<script>WO.begin({ title: 'Pesanan', active: 'orders', actions: '<button class="btn btn-sm btn-primary btn-round" id="btn-new">+ Pesanan Baru (Walk-in)</button>' });</script>

<div class="card">
    <div class="card-header d-block">
        <div class="row">
            <div class="col-xl-7 mb-2">
                <div class="btn-group flex-wrap" id="status-filter">
                    <button class="btn btn-sm btn-outline-primary active" data-status="">Semua</button>
                    <button class="btn btn-sm btn-outline-primary" data-status="Menunggu">Menunggu</button>
                    <button class="btn btn-sm btn-outline-primary" data-status="Ditugaskan">Ditugaskan</button>
                    <button class="btn btn-sm btn-outline-primary" data-status="Dicuci">Dicuci</button>
                    <button class="btn btn-sm btn-outline-primary" data-status="Siap">Siap</button>
                    <button class="btn btn-sm btn-outline-primary" data-status="Selesai">Selesai</button>
                    <button class="btn btn-sm btn-outline-primary" data-status="Dibatalkan">Batal</button>
                </div>
            </div>
            <div class="col-xl-2 col-md-6 mb-2">
                <select id="pay-filter" class="form-control form-control-sm">
                    <option value="">Semua pembayaran</option><option value="unpaid">Belum lunas</option><option value="paid">Lunas</option>
                </select>
            </div>
            <div class="col-xl-3 col-md-6 mb-2"><input id="q" class="form-control form-control-sm" placeholder="Cari kode / nama / HP"></div>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr><th>Kode</th><th>Pelanggan</th><th>Washer</th><th>Total</th><th>Status</th><th>Pembayaran</th><th>Masuk</th></tr></thead>
            <tbody id="rows"><tr><td colspan="7" class="wo-empty">Memuat...</td></tr></tbody>
        </table>
    </div>
</div>

<!-- Modal detail -->
<div class="modal fade" id="detail" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="d-title">Detail</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div>
    <div class="modal-body" id="d-body"></div>
</div></div></div>

<!-- Modal pesanan baru -->
<div class="modal fade" id="newmodal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
    <form id="new-form">
    <div class="modal-header"><h5 class="modal-title">Pesanan Baru</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div>
    <div class="modal-body">
        <div class="row">
            <div class="col-md-6 form-group"><label>Nama pelanggan</label><input class="form-control" id="n-name" required></div>
            <div class="col-md-6 form-group"><label>No. HP</label><input class="form-control" id="n-phone" required></div>
            <div class="col-md-4 form-group"><label>Layanan antar/jemput</label>
                <select class="form-control" id="n-type"><option value="antar_sendiri">Pelanggan antar sendiri</option><option value="jemput">Dijemput</option></select></div>
            <div class="col-md-8 form-group"><label>Alamat (jika dijemput)</label><input class="form-control" id="n-address"></div>
            <div class="col-12 form-group"><label>Catatan</label><input class="form-control" id="n-notes"></div>
        </div>
        <label>Layanan</label>
        <div id="n-items"></div>
        <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="n-add">+ Tambah layanan</button>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Batal</button><button class="btn btn-primary" type="submit">Simpan Pesanan</button></div>
    </form>
</div></div></div>

<script>WO.end();</script>
<script>
WO.ready(function () {
    var state = { status: '', payment: '', q: '' }, services = [], workers = [], current = null, qTimer;
    var $ = window.jQuery;

    function loadList() {
        var qs = ['status=' + encodeURIComponent(state.status), 'payment=' + state.payment, 'q=' + encodeURIComponent(state.q)].join('&');
        WO.api('/admin/orders?' + qs).then(function (r) {
            document.getElementById('rows').innerHTML = r.data.length ? r.data.map(function (o) {
                return '<tr class="clickable" data-id="' + o.id + '"><td class="wo-code">' + WO.esc(o.code) + '</td><td>' + WO.esc(o.client_name) +
                    '<br><small class="text-muted">' + WO.esc(o.client_phone) + '</small></td><td>' + WO.esc(o.washer_name || '-') + '</td><td>' + WO.rp(o.total) +
                    '</td><td>' + WO.badge(o.status) + '</td><td>' + WO.payBadge(o) + '</td><td><small>' + WO.date(o.created_at) + '</small></td></tr>';
            }).join('') : '<tr><td colspan="7" class="wo-empty">Tidak ada pesanan</td></tr>';
        }).catch(WO.fail);
    }

    document.getElementById('rows').addEventListener('click', function (e) {
        var tr = e.target.closest('tr[data-id]'); if (tr) openDetail(tr.dataset.id);
    });
    document.getElementById('status-filter').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        [].forEach.call(this.children, function (x) { x.classList.toggle('active', x === b); });
        state.status = b.dataset.status; loadList();
    });
    document.getElementById('pay-filter').addEventListener('change', function () { state.payment = this.value; loadList(); });
    document.getElementById('q').addEventListener('input', function () { var v = this.value; clearTimeout(qTimer); qTimer = setTimeout(function () { state.q = v; loadList(); }, 300); });

    /* ---------- Detail ---------- */
    function itemRow(i, idx) {
        var opts = services.filter(function (s) { return s.active || s.id === i.service_id; }).map(function (s) {
            return '<option value="' + s.id + '"' + (s.id === i.service_id ? ' selected' : '') + '>' + WO.esc(s.name) + ' (' + WO.rp(s.price) + '/' + (s.type === 'kg' ? 'kg' : 'pcs') + ')' + (s.active ? '' : ' [nonaktif]') + '</option>';
        }).join('');
        return '<div class="input-group input-group-sm mb-1 item-row"><select class="form-control it-svc" style="max-width:60%">' + opts + '</select>' +
            '<input type="number" step="0.1" min="0.1" class="form-control it-qty" value="' + (i.qty || 1) + '">' +
            '<div class="input-group-append"><button type="button" class="btn btn-outline-danger it-del">&times;</button></div></div>';
    }

    function openDetail(id) {
        WO.api('/admin/orders/' + id).then(function (r) { current = r.data; renderDetail(); $('#detail').modal('show'); }).catch(WO.fail);
    }

    function renderDetail() {
        var o = current, open = o.status !== 'Selesai' && o.status !== 'Dibatalkan', due = o.total - o.paid;
        document.getElementById('d-title').innerHTML = '<span class="wo-code">' + WO.esc(o.code) + '</span> ' + WO.badge(o.status);
        var h = '<div class="row"><div class="col-md-6"><p class="mb-1"><b>' + WO.esc(o.client_name) + '</b></p><p class="mb-1"><i class="fa fa-phone"></i> ' + WO.esc(o.client_phone) + '</p>' +
            '<p class="mb-1"><i class="fa fa-map-marker"></i> ' + (o.delivery_type === 'jemput' ? WO.esc(o.client_address) : '<i>Pelanggan antar sendiri</i>') + '</p>' +
            (o.notes ? '<p class="mb-1 text-warning"><i class="fa fa-sticky-note"></i> ' + WO.esc(o.notes) + '</p>' : '') +
            '<small class="text-muted">Masuk ' + WO.date(o.created_at) + '</small></div>';

        // penugasan washer
        h += '<div class="col-md-6"><label class="mb-1"><b>Washer</b></label>';
        if (o.status === 'Menunggu' || o.status === 'Ditugaskan') {
            h += '<div class="input-group input-group-sm"><select class="form-control" id="d-washer"><option value="">-- pilih washer --</option>' +
                workers.filter(function (w) { return w.active; }).map(function (w) {
                    return '<option value="' + w.id + '"' + (w.id === o.washer_id ? ' selected' : '') + '>' + WO.esc(w.name) + ' (' + w.active_jobs + ' tugas)</option>';
                }).join('') + '</select><div class="input-group-append"><button class="btn btn-primary" id="d-assign">' + (o.washer_id ? 'Ganti' : 'Tugaskan') + '</button></div></div>';
        } else h += '<p class="mb-0">' + WO.esc(o.washer_name || '-') + '</p>';
        h += '</div></div><hr>';

        // rincian
        h += '<h6>Rincian Pesanan</h6>';
        if (open) {
            h += '<div id="d-items">' + o.items.map(itemRow).join('') + '</div><div class="mb-2"><button class="btn btn-sm btn-outline-primary" id="d-additem">+ Layanan</button> ' +
                '<button class="btn btn-sm btn-success" id="d-saveitems">Simpan rincian / berat</button></div>' +
                '<small class="text-muted">Ubah berat aktual (kg) setelah ditimbang, lalu simpan. Harga lama tetap dipakai untuk layanan yang sama.</small>';
        } else {
            h += '<table class="table table-sm"><tbody>' + o.items.map(function (i) {
                return '<tr><td>' + WO.esc(i.service_name) + '</td><td>' + WO.qty(i) + ' x ' + WO.rp(i.unit_price) + '</td><td class="text-right">' + WO.rp(i.subtotal) + '</td></tr>'; }).join('') + '</tbody></table>';
        }
        h += '<div class="d-flex justify-content-between mt-2"><span>Total</span><b>' + WO.rp(o.total) + '</b></div>' +
            '<div class="d-flex justify-content-between"><span>Dibayar</span><b class="text-success">' + WO.rp(o.paid) + '</b></div>' +
            '<div class="d-flex justify-content-between"><span>Sisa</span><b class="' + (due > 0 ? 'text-danger' : '') + '">' + WO.rp(Math.max(due, 0)) + '</b></div>';

        // pembayaran
        if (o.status !== 'Dibatalkan' && due > 0) {
            h += '<div class="input-group input-group-sm mt-3"><input type="number" class="form-control" id="d-amount" min="1" max="' + due + '" value="' + due + '">' +
                '<select class="form-control" id="d-method" style="max-width:130px"><option>Tunai</option><option>Transfer</option><option>QRIS</option></select>' +
                '<div class="input-group-append"><button class="btn btn-success" id="d-pay"><i class="fa fa-money"></i> Catat Pembayaran</button></div></div>';
        }

        // aksi status
        var next = { Ditugaskan: 'Dicuci', Dicuci: 'Siap', Siap: 'Selesai' }[o.status];
        h += '<div class="mt-3">';
        if (next) h += '<button class="btn btn-sm btn-info mr-2" data-status="' + next + '">Tandai ' + next + '</button>';
        if (open) h += '<button class="btn btn-sm btn-outline-danger" data-status="Dibatalkan">Batalkan Pesanan</button>';
        h += '</div><hr><h6>Riwayat</h6><ul class="wo-log">' + o.logs.slice().reverse().map(function (l) {
            return '<li><b>' + WO.esc(l.status) + '</b> <small class="text-muted">' + WO.date(l.created_at) + (l.actor ? ' - ' + WO.esc(l.actor) : '') + '</small>' + (l.note ? '<br><small>' + WO.esc(l.note) + '</small>' : '') + '</li>';
        }).join('') + '</ul>';
        document.getElementById('d-body').innerHTML = h;
    }

    function refreshDetail() {
        return WO.api('/admin/orders/' + current.id).then(function (r) { current = r.data; renderDetail(); loadList(); });
    }

    document.getElementById('d-body').addEventListener('click', function (e) {
        var t = e.target.closest('button'); if (!t) return;
        if (t.id === 'd-assign') {
            var wid = document.getElementById('d-washer').value; if (!wid) return WO.toast('Pilih washer dulu', true);
            WO.api('/admin/orders/' + current.id + '/assign', { method: 'POST', body: { washer_id: Number(wid) } }).then(function (r) { WO.toast(r.message); return loadWorkers().then(refreshDetail); }).catch(WO.fail);
        } else if (t.id === 'd-additem') {
            document.getElementById('d-items').insertAdjacentHTML('beforeend', itemRow({ service_id: services[0].id, qty: 1 }));
        } else if (t.classList.contains('it-del')) {
            if (document.querySelectorAll('.item-row').length > 1) t.closest('.item-row').remove();
        } else if (t.id === 'd-saveitems') {
            WO.api('/admin/orders/' + current.id + '/items', { method: 'PUT', body: { items: readItems('#d-items') } }).then(function (r) { WO.toast(r.message); return refreshDetail(); }).catch(WO.fail);
        } else if (t.id === 'd-pay') {
            WO.api('/admin/orders/' + current.id + '/pay', { method: 'POST', body: { amount: Number(document.getElementById('d-amount').value), method: document.getElementById('d-method').value } })
                .then(function (r) { WO.toast(r.message); return refreshDetail(); }).catch(WO.fail);
        } else if (t.dataset.status) {
            var st = t.dataset.status;
            if (st === 'Dibatalkan' && !confirm('Batalkan pesanan ' + current.code + '?' + (current.paid ? ' Pembayaran akan dicatat sebagai refund.' : ''))) return;
            WO.api('/admin/orders/' + current.id + '/status', { method: 'POST', body: { status: st } }).then(function (r) { WO.toast(r.message); return refreshDetail(); }).catch(WO.fail);
        }
    });

    function readItems(sel) {
        return [].map.call(document.querySelectorAll(sel + ' .item-row'), function (r) {
            return { service_id: Number(r.querySelector('.it-svc').value), qty: Number(r.querySelector('.it-qty').value) };
        });
    }

    /* ---------- Pesanan baru ---------- */
    function addNewItem() { document.getElementById('n-items').insertAdjacentHTML('beforeend', itemRow({ service_id: services.filter(function (s) { return s.active; })[0].id, qty: 1 })); }
    function openNew() {
        document.getElementById('new-form').reset();
        document.getElementById('n-items').innerHTML = ''; addNewItem();
        $('#newmodal').modal('show');
    }
    document.getElementById('btn-new').addEventListener('click', openNew);
    document.getElementById('n-add').addEventListener('click', addNewItem);
    document.getElementById('n-items').addEventListener('click', function (e) {
        var t = e.target.closest('.it-del'); if (t && document.querySelectorAll('#n-items .item-row').length > 1) t.closest('.item-row').remove();
    });
    document.getElementById('new-form').addEventListener('submit', function (e) {
        e.preventDefault();
        WO.api('/admin/orders', { method: 'POST', body: {
            client_name: val('n-name'), client_phone: val('n-phone'), client_address: val('n-address'), delivery_type: val('n-type'), notes: val('n-notes'), items: readItems('#n-items')
        } }).then(function (r) { $('#newmodal').modal('hide'); WO.toast('Pesanan ' + r.code + ' dibuat'); loadList(); }).catch(WO.fail);
    });
    function val(id) { return document.getElementById(id).value; }

    function loadWorkers() { return WO.api('/admin/workers').then(function (r) { workers = r.data; }); }

    Promise.all([WO.api('/admin/services'), loadWorkers()]).then(function (r) {
        services = r[0].data;
        loadList();
        var p = new URLSearchParams(location.search);
        if (p.get('open')) openDetail(p.get('open'));
        if (p.get('new')) openNew();
    }).catch(WO.fail);
    setInterval(function () { if (!document.querySelector('.modal.show')) loadList(); }, 30000);
});
</script>
</body>
</html>
